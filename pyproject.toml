[project]
name = "subpixel"
version = "1.0.0"
description = "Python CLI that hides messages in an image's least-significant bits."
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
subpixel = "subpixel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"